name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install connectome build tools
        run: python -m pip install --upgrade pandas pyarrow numpy
      - name: Download published FlyWire FAFB v783 whole-brain model
        run: |
          mkdir -p build/flywire
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/main/Completeness_783.csv \
            --output build/flywire/Completeness_783.csv
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/main/Connectivity_783.parquet \
            --output build/flywire/Connectivity_783.parquet
          test -s build/flywire/Completeness_783.csv
          test -s build/flywire/Connectivity_783.parquet
      - name: Pack complete FAFB v783 connectome
        run: |
          python tools/build_flywire_brain.py \
            --completeness build/flywire/Completeness_783.csv \
            --connectivity build/flywire/Connectivity_783.parquet \
            --out app/src/main/assets/flywire_brain.bin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: My-First-AI-FlyWire-FAFB-v783
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
